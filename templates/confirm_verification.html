<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Confirm Your Email</title>
</head>

<body
    style="font-family: 'Schibsted Grotesk', sans-serif; font-size: 1rem; color: #1a1a1a; text-align: center; background-color: #ffffff; padding: 40px;">

    <div style="font-weight: 600; font-size: 1.5rem; margin-bottom: 8px;">Confirm Email Verification</div>
    <div style="margin-bottom: 36px;">Click the button below to verify your email address.</div>

    <form method="POST" action="{{ url_for('finalize_verification', token=token) }}" style="margin-bottom: 36px;">
        <button type="submit" style="
            display: inline-block;
            font-size: 1rem;
            font-family: 'Schibsted Grotesk', sans-serif;
            padding: 12px 24px;
            box-sizing: border-box;
            border: none;
            background-color: #1C46F5;
            border-radius: 10px;
            cursor: pointer;
            color: #f6f6f6;
            text-align: center;
        ">Confirm Verification</button>
    </form>

</body>

</html>
